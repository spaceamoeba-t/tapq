name: CI

on:
  push:
    branches:
      - main
      - "worktree-**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release version consistency
        run: scripts/check-release-version.sh
      - name: Install boundary-check dependency
        run: brew install ripgrep
      - name: Toolchain
        run: swift --version | grep -E 'Swift version 6\.'
      - name: Check public and portability boundaries
        run: scripts/check-public-boundary.sh
      - name: Build complete macOS graph
        run: swift build -c release
      - name: Test complete macOS graph
        run: swift test

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release version consistency
        run: scripts/check-release-version.sh
      - name: Install boundary-check dependency
        run: apt-get update && apt-get install -y ripgrep
      - name: Toolchain
        run: swift --version | grep -E 'Swift version 6\.'
      - name: Check public and portability boundaries
        run: scripts/check-public-boundary.sh
      - name: Build portable and POSIX graph
        run: swift build -c release
      - name: Test portable and POSIX graph
        run: swift test
