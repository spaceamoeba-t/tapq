       Apache License 2.0; see LICENSE and ../../TRADEMARKS.md. -->
  <title id="t">TapQ gestures</title>
  <desc id="d">Four gestures: double nod to approve or confirm, double shake to deny or return to the screen, double tilt to move between options, and a stem tap or swipe to confirm or navigate.</desc>
  <defs>
    <g id="head" fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="34" cy="34" rx="24" ry="30"/>
      <path d="M2 68 C 8 80, 60 80, 66 68"/>
      <circle cx="10" cy="36" r="4" fill="#C8F031" stroke="none"/>
      <circle cx="58" cy="36" r="4" fill="#C8F031" stroke="none"/>
    </g>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
    <rect width="1200" height="330" rx="24" fill="#101112"/>
    <rect x="0.5" y="0.5" width="1199" height="329" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="48" y="48" fill="#C8F031" font-size="12" font-weight="600" letter-spacing="3">GESTURES</text>

    <!-- 1. double nod -->
    <g transform="translate(48 70)">
      <rect width="536" height="104" rx="16" fill="#161617" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <use href="#head" x="28" y="14"/>
      <g transform="translate(130 24)" stroke="#C8F031" stroke-width="2.4" fill="none">
        <path d="M0 0 V56 M-8 9 L0 0 L8 9 M-8 47 L0 56 L8 47"/>
      </g>
      <text x="170" y="46" fill="#FFFFFF" font-size="18" font-weight="700">Double nod</text>
      <text x="170" y="70" fill="#A7A9AD" font-size="14">approve, or confirm the selected option</text>
      <text x="170" y="91" fill="#C8F031" font-size="13" font-weight="600">say: "yes", "approve", "select"</text>
    </g>

    <!-- 2. double shake -->
    <g transform="translate(616 70)">
      <rect width="536" height="104" rx="16" fill="#161617" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <use href="#head" x="28" y="14"/>
      <g transform="translate(108 52)" stroke="#C8F031" stroke-width="2.4" fill="none">
        <path d="M0 0 H46 M9 -8 L0 0 L9 8 M37 -8 L46 0 L37 8"/>
      </g>
      <text x="170" y="46" fill="#FFFFFF" font-size="18" font-weight="700">Double shake</text>
      <text x="170" y="70" fill="#A7A9AD" font-size="14">deny, or hand the prompt back to the screen</text>
      <text x="170" y="91" fill="#C8F031" font-size="13" font-weight="600">say: "no", "skip", "later"</text>
    </g>

    <!-- 3. double tilt -->
    <g transform="translate(48 190)">
      <rect width="536" height="104" rx="16" fill="#161617" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <g transform="translate(28 14) rotate(-16 34 40)"><use href="#head"/></g>
      <g transform="translate(106 22)" stroke="#C8F031" stroke-width="2.4" fill="none">
        <path d="M4 40 A 30 30 0 0 1 44 20 M36 12 L44 20 L36 28"/>
      </g>
      <text x="170" y="46" fill="#FFFFFF" font-size="18" font-weight="700">Double tilt</text>
      <text x="170" y="70" fill="#A7A9AD" font-size="14">right for the next option, left for the previous</text>
      <text x="170" y="91" fill="#C8F031" font-size="13" font-weight="600">say: "next", "previous"</text>
    </g>

    <!-- 4. stem tap or swipe -->
    <g transform="translate(616 190)">
      <rect width="536" height="104" rx="16" fill="#161617" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <g transform="translate(40 18)">
        <circle cx="30" cy="22" r="13" fill="#C8F031"/>
        <path d="M26 34 L18 64" stroke="#C8F031" stroke-width="10" fill="none"/>
        <circle cx="30" cy="22" r="24" fill="none" stroke="#C8F031" stroke-opacity="0.45" stroke-width="1.6"/>
        <circle cx="30" cy="22" r="36" fill="none" stroke="#C8F031" stroke-opacity="0.2" stroke-width="1.4"/>
      </g>
      <text x="170" y="46" fill="#FFFFFF" font-size="18" font-weight="700">Tap or stem swipe</text>
      <text x="170" y="70" fill="#A7A9AD" font-size="14">double tap confirms; swipe the stem to move</text>
      <text x="170" y="91" fill="#C8F031" font-size="13" font-weight="600">stem swipes need AirPods Pro 2 or later</text>
    </g>
  </g>
</svg>
